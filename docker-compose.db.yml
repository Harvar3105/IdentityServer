# Shared SQL Server for all IdentityServer instances on this host. Start it once:
#   docker network create shared-network
#   docker compose -f docker-compose.db.yml up -d
# Reads MSSQL_SA_PASSWORD from .env (see .env.example).

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is not set}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1" ]
      interval: 30s
      retries: 5
      start_period: 20s
    networks:
      - shared-network

volumes:
  sqlserver_data:

networks:
  shared-network:
    name: shared-network
    external: true
