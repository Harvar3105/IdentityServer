# One IdentityServer instance per client project; every instance has its own env file and database.
#   docker compose --env-file instances/<project>.env up -d --build
# Requires the shared SQL Server from docker-compose.db.yml.

services:
  authserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: identityserver:latest
    restart: unless-stopped
    env_file:
      - ${INSTANCE_ENV_FILE:?INSTANCE_ENV_FILE is not set}
    volumes:
      - ${ROLES_FILE:?ROLES_FILE is not set}:/app/Seed/roles.json:ro
    ports:
      - "${AUTH_PORT:?AUTH_PORT is not set}:8080"
    networks:
      - shared-network

networks:
  shared-network:
    name: shared-network
    external: true
